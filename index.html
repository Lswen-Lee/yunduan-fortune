<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="雲端宮線上靈籤：許願、擲筊，連續三個聖筊後抽出一支原創籤詩。僅供娛樂。">
<title>雲端宮線上靈籤</title>
<style>
:root{
  --red:#B3261E;
  --gold:#D4A84B;
  --bg:#5C0F0B;
  --paper:#F7EFDD;
  --ink:#2B1D14;
  --muted:#6B5646;
  --field:#FFFAF0;
  --font-kai:"DFKai-SB","BiauKai","標楷體","Kaiti TC","KaiTi","STKaiti","PMingLiU","Songti TC","Noto Serif TC","Noto Serif CJK TC",serif;
  --font-sans:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 18% 8%,rgba(212,168,75,.14),transparent 42%),
    radial-gradient(circle at 86% 92%,rgba(212,168,75,.10),transparent 46%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-sans);
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.app{max-width:480px;min-height:100vh;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
main{flex:1}

/* 廟匾 */
.plaque{position:relative;padding:14px 56px;text-align:center;background:linear-gradient(#C22E25,var(--red) 55%,#9A1F18);border:3px double var(--gold);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.plaque h1{margin:0;font-family:var(--font-kai);font-size:2.3rem;line-height:1.2;letter-spacing:.35em;text-indent:.35em;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.plaque p{margin:2px 0 0;font-size:.95rem;letter-spacing:.5em;text-indent:.5em;color:var(--paper)}
.mute{position:absolute;top:8px;right:8px;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--gold);background:rgba(92,15,11,.55);color:var(--gold);cursor:pointer;touch-action:manipulation}
.mute svg{width:24px;height:24px}
.mute .ico-off{display:none}
.mute[aria-pressed="true"] .ico-on{display:none}
.mute[aria-pressed="true"] .ico-off{display:block}

/* 步驟指示 */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;scroll-margin-top:10px}
.steps li{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 2px;border-radius:999px;border:1.5px solid rgba(212,168,75,.45);color:rgba(247,239,221,.75);font-size:.9rem;white-space:nowrap}
.steps .num{font-family:var(--font-kai)}
.steps li.done{border-color:var(--gold);color:var(--gold)}
.steps li[aria-current="step"]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}

/* 卡片與畫面切換 */
.card{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:20px 18px 22px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.stage.fade-out{opacity:0;transition:opacity .15s ease-in}
.stage.fade-in{animation:fadeIn .15s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
h2{margin:0 0 6px;text-align:center;font-family:var(--font-kai);font-size:1.6rem;letter-spacing:.12em;color:var(--red)}
h2:focus{outline:none}
.lead{margin:0 0 16px;text-align:center;font-size:.95rem;color:var(--muted)}

/* 許願表單 */
.field{min-width:0;margin:0 0 10px;padding:0;border:0}
.field>label,.field>legend{display:block;margin-bottom:6px;padding:0;font-weight:700}
.cats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cats label{display:flex;align-items:center;justify-content:center;min-height:46px;border:1.5px solid var(--red);border-radius:10px;background:var(--field);color:var(--red);font-family:var(--font-kai);font-size:1.15rem;cursor:pointer;user-select:none;transition:background .15s,color .15s}
.cats input:checked+label{background:var(--red);color:var(--paper);box-shadow:inset 0 0 0 2px var(--gold)}
.cats input:focus-visible+label{outline:3px solid var(--ink);outline-offset:2px}
input[type="date"],textarea{width:100%;min-height:46px;padding:11px 12px;border:1.5px solid #B79C6C;border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
textarea{display:block;min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.field-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.count{margin-top:4px;font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.err{min-height:1.2em;margin:4px 0 0;font-size:.88rem;font-weight:600;color:var(--red)}
.privacy{margin:10px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}

/* 按鈕 */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:10px 16px;border-radius:12px;font:inherit;font-size:1.1rem;font-weight:700;letter-spacing:.1em;cursor:pointer;touch-action:manipulation;transition:transform .08s,filter .15s,opacity .15s}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tube:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.mute:focus-visible,.actions .btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.primary{border:2px solid var(--gold);background:var(--red);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{border-color:var(--red);background:var(--gold);color:var(--ink)}
.btn.secondary{border:2px solid var(--gold);background:var(--paper);color:var(--red)}
.btn.link{min-height:44px;margin-top:4px;border:0;background:none;color:var(--muted);font-size:.95rem;font-weight:400;letter-spacing:0;text-decoration:underline}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

/* 擲筊 */
.report{margin:0 0 12px;padding:10px 12px;border-left:4px solid var(--red);border-radius:0 8px 8px 0;background:rgba(179,38,30,.07);font-family:var(--font-kai);font-size:1.05rem;line-height:1.6;overflow-wrap:anywhere;max-height:calc(1.6em * 4 + 20px);overflow-y:auto}
.altar{height:216px;padding-bottom:18px;display:flex;justify-content:center;align-items:flex-end;gap:36px;overflow:hidden;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(#4A2A1A,#2F190F)}
.cup{width:68px;height:119px;will-change:transform}
.cup-persp{width:100%;height:100%;perspective:520px}
.cup-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.round{transform:rotateX(180deg)}
.face svg{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.caps{display:flex;justify-content:center;gap:36px;min-height:1.5em;margin-top:6px}
.caps span{width:68px;text-align:center;font-size:.85rem;color:var(--muted)}
.jiao-result{min-height:4em;margin:2px 0 8px;text-align:center}
.jiao-result strong{display:block;min-height:1.2em;font-family:var(--font-kai);font-size:2rem;line-height:1.2;color:var(--red)}
.jiao-result span{font-size:.95rem}
.jiao-result.xiao strong{color:#8A6410}
.jiao-result.yin strong{color:var(--ink)}
.progress{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;margin:0 0 14px;font-size:.95rem}
.lamps{display:flex;gap:10px}
.lamp{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);background:rgba(43,29,20,.12);transition:background .3s,box-shadow .3s}
.lamp.on{background:radial-gradient(circle at 35% 30%,#FFE9A8,var(--gold) 60%,#B8862B);box-shadow:0 0 14px 4px rgba(212,168,75,.75)}
.tally{color:var(--muted);font-variant-numeric:tabular-nums}
.history{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:28px;margin-top:12px}
.chip{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--font-kai);font-size:.95rem;line-height:1}
.chip.sheng{background:var(--red);color:var(--paper)}
.chip.xiao{background:var(--gold);color:var(--ink)}
.chip.yin{background:var(--ink);color:var(--paper)}
.hint{margin:10px 0 0;text-align:center;font-size:.85rem;color:var(--muted)}

/* 抽籤 */
.tube{display:block;width:190px;max-width:70%;margin:4px auto 0;padding:0;border:0;border-radius:14px;background:none;cursor:pointer;touch-action:manipulation}
.tube:disabled{cursor:default}
.tube svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 92%}
.tube.shaking svg{animation:shake 1.5s ease-in-out}
@keyframes shake{
  0%,100%{transform:rotate(0)}
  8%{transform:rotate(-11deg)}16%{transform:rotate(10deg)}
  24%{transform:rotate(-10deg)}32%{transform:rotate(11deg)}
  40%{transform:rotate(-11deg)}48%{transform:rotate(10deg)}
  56%{transform:rotate(-10deg)}64%{transform:rotate(11deg)}
  72%{transform:rotate(-9deg)}80%{transform:rotate(8deg)}
  88%{transform:rotate(-5deg)}94%{transform:rotate(3deg)}
}
.stick-out{transform:translateY(60px);transition:transform .5s cubic-bezier(.2,.9,.3,1.25)}
.tube.drawn .stick-out{transform:translateY(-22px)}
.draw-msg{min-height:1.6em;margin:8px 0 14px;text-align:center;font-family:var(--font-kai);font-size:1.5rem;color:var(--red)}

/* 解籤 */
.result-card.rise{animation:rise .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.res-head{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:4px;color:var(--ink);letter-spacing:.08em}
.level{padding:2px 12px;border-radius:999px;font-size:1.15rem;letter-spacing:.1em}
.level[data-level="上上"]{background:var(--red);color:var(--paper)}
.level[data-level="上吉"]{background:var(--gold);color:var(--ink)}
.level[data-level="中平"]{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.level[data-level="下下"]{background:var(--ink);color:var(--paper)}
.res-title{margin:0;text-align:center;font-family:var(--font-kai);font-size:1.5rem;color:var(--red);letter-spacing:.2em}
.poem-wrap{display:flex;justify-content:center;margin:10px 0 14px;padding:14px 0 16px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.poem{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;font-family:var(--font-kai);font-size:1.75rem;line-height:2;letter-spacing:.2em}
.poem p{margin:0}
.result-card h3{margin:14px 0 4px;font-size:.95rem;letter-spacing:.08em;color:var(--red)}
.result-card h3::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:middle;background:var(--gold);transform:rotate(45deg)}
.result-card p{margin:0}
.res-wish{color:var(--muted);overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions .wide{grid-column:1/-1}
.actions .btn{font-size:1rem;letter-spacing:.04em}

footer{padding-top:4px;text-align:center;font-size:.8rem;color:rgba(247,239,221,.78)}

/* 系統設定為減少動態效果時，只保留淡入 */
@media (prefers-reduced-motion:reduce){
  .btn,.cats label,.lamp{transition:none}
  .stage.fade-out{transition:none}
  .tube.shaking svg{animation:fadeIn .3s ease-out}
  .stick-out{transition:none}
  .result-card.rise{animation:fadeIn .3s ease-out both}
}
</style>
</head>
<body>
<div class="app">

  <header class="plaque">
    <h1>雲端宮</h1>
    <p>線上靈籤</p>
    <button type="button" class="mute" id="muteBtn" aria-pressed="false" aria-label="靜音">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <ol class="steps" id="steps" aria-label="求籤步驟">
    <li data-step="wish"><span class="num">一</span>許願</li>
    <li data-step="throw"><span class="num">二</span>擲筊</li>
    <li data-step="draw"><span class="num">三</span>抽籤</li>
    <li data-step="result"><span class="num">四</span>解籤</li>
  </ol>

  <main>
    <!-- 一、許願 -->
    <section class="stage card" id="stage-wish" aria-labelledby="h-wish">
      <h2 id="h-wish" tabindex="-1">誠心許願</h2>
      <p class="lead">選擇所求類別，填寫生日與想請示的事，再向神明擲筊。</p>
      <form id="wishForm" novalidate>
        <fieldset class="field">
          <legend>所求類別</legend>
          <div class="cats">
            <input type="radio" name="category" id="cat0" value="學業"><label for="cat0">學業</label>
            <input type="radio" name="category" id="cat1" value="感情"><label for="cat1">感情</label>
            <input type="radio" name="category" id="cat2" value="事業"><label for="cat2">事業</label>
            <input type="radio" name="category" id="cat3" value="健康"><label for="cat3">健康</label>
            <input type="radio" name="category" id="cat4" value="財運"><label for="cat4">財運</label>
            <input type="radio" name="category" id="cat5" value="其他"><label for="cat5">其他</label>
          </div>
          <p class="err" id="errCategory" aria-live="polite"></p>
        </fieldset>
        <div class="field">
          <label for="birthday">生日</label>
          <input type="date" id="birthday" name="birthday" min="1900-01-01" placeholder="YYYY-MM-DD" autocomplete="off">
          <p class="err" id="errBirthday" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="wish">想請示的事</label>
          <textarea id="wish" name="wish" rows="3" maxlength="100" placeholder="例如：期中考能否順利？"></textarea>
          <div class="field-foot">
            <p class="err" id="errWish" aria-live="polite"></p>
            <span class="count" id="wishCount">0／100</span>
          </div>
        </div>
        <button type="submit" class="btn primary" id="startBtn" aria-disabled="true">開始擲筊</button>
        <p class="privacy">願望與生日只留在這個畫面，不會儲存或上傳。</p>
      </form>
    </section>

    <!-- 二、擲筊 -->
    <section class="stage card" id="stage-throw" aria-labelledby="h-throw" hidden>
      <h2 id="h-throw" tabindex="-1">擲筊請示</h2>
      <blockquote class="report" id="report"></blockquote>
      <div class="altar" aria-hidden="true">
        <div class="cup" id="cupL"><div class="cup-persp"><div class="cup-inner"><div class="face flat"></div><div class="face round"></div></div></div></div>
        <div class="cup" id="cupR"><div class="cup-persp"><div class="cup-inner"><div class="face flat"></div><div class="face round"></div></div></div></div>
      </div>
      <div class="caps" aria-hidden="true"><span id="capL"></span><span id="capR"></span></div>
      <div class="jiao-result" id="jiaoResult" aria-live="polite"><strong id="jiaoName"></strong><span id="jiaoDesc"></span></div>
      <div class="progress">
        <span aria-hidden="true">連續聖筊</span>
        <div class="lamps" id="lamps" role="img" aria-label="連續聖筊 0／3"><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span></div>
        <span class="tally" id="tally"></span>
      </div>
      <button type="button" class="btn primary" id="throwBtn">擲筊</button>
      <button type="button" class="btn primary gold" id="toDrawBtn" hidden>前往抽籤</button>
      <div class="history" id="history" aria-label="擲筊歷程"></div>
      <p class="hint">也可以按鍵盤空白鍵擲筊。連續三個聖筊才能抽籤。</p>
      <button type="button" class="btn link" id="rewishBtn">重新許願</button>
    </section>

    <!-- 三、抽籤 -->
    <section class="stage card" id="stage-draw" aria-labelledby="h-draw" hidden>
      <h2 id="h-draw" tabindex="-1">搖筒抽籤</h2>
      <p class="lead">神明已允准。點擊籤筒，搖出一支靈籤。</p>
      <button type="button" class="tube" id="tubeBtn" aria-label="搖籤筒">
        <svg viewBox="0 0 160 230" aria-hidden="true">
          <ellipse cx="80" cy="84" rx="47" ry="11" fill="#3A0806"/>
          <g fill="#E9C98F" stroke="#A9814A" stroke-width="1">
            <rect x="50" y="30" width="9" height="90" rx="3" transform="rotate(-11 54 120)"/>
            <rect x="60" y="22" width="9" height="96" rx="3" transform="rotate(-5 64 118)"/>
            <rect x="88" y="26" width="9" height="94" rx="3" transform="rotate(4 92 120)"/>
            <rect x="100" y="32" width="9" height="88" rx="3" transform="rotate(11 104 120)"/>
            <rect x="94" y="20" width="9" height="98" rx="3" transform="rotate(7 98 118)"/>
            <rect x="68" y="28" width="9" height="92" rx="3" transform="rotate(-2 72 120)"/>
          </g>
          <g class="stick-out">
            <rect x="74" y="34" width="12" height="104" rx="3" fill="#F2D7A2" stroke="#A9814A" stroke-width="1"/>
            <rect x="74" y="34" width="12" height="22" rx="3" fill="#B3261E"/>
          </g>
          <path d="M33 84L41 208Q80 222 119 208L127 84Q80 100 33 84Z" fill="#B3261E" stroke="#D4A84B" stroke-width="2" stroke-linejoin="round"/>
          <path d="M34.5 104Q80 120 125.5 104" fill="none" stroke="#D4A84B" stroke-width="3"/>
          <path d="M40 192Q80 207 120 192" fill="none" stroke="#D4A84B" stroke-width="3"/>
          <circle cx="80" cy="152" r="25" fill="#D4A84B" stroke="#8A1B15" stroke-width="2"/>
          <text x="80" y="163" text-anchor="middle" font-size="30" fill="#5C0F0B" style="font-family:var(--font-kai)">籤</text>
        </svg>
      </button>
      <p class="draw-msg" id="drawMsg" aria-live="polite"></p>
      <button type="button" class="btn primary" id="shakeBtn">搖籤筒</button>
      <button type="button" class="btn primary gold" id="viewBtn" hidden>看籤詩</button>
    </section>

    <!-- 四、解籤 -->
    <section class="stage" id="stage-result" aria-labelledby="resHead" hidden>
      <article class="card result-card" id="resultCard">
        <h2 class="res-head" id="resHead" tabindex="-1"><span id="resNo"></span><span class="level" id="resLevel"></span></h2>
        <p class="res-title" id="resTitle"></p>
        <div class="poem-wrap"><div class="poem" id="poem"></div></div>
        <h3>白話解說</h3>
        <p id="resExplain"></p>
        <h3 id="resAdviceLabel"></h3>
        <p id="resAdvice"></p>
        <h3>所求之事</h3>
        <p class="res-wish" id="resWish"></p>
      </article>
      <div class="actions">
        <button type="button" class="btn secondary" id="copyBtn">複製籤詩文字</button>
        <button type="button" class="btn secondary" id="saveBtn">下載籤詩圖片</button>
        <button type="button" class="btn primary wide" id="againBtn">再求一支</button>
      </div>
    </section>
  </main>

  <footer>本網頁僅供娛樂，與任何真實宮廟無關。籤詩皆為原創。</footer>
</div>

<noscript><p style="color:#F7EFDD;text-align:center">此網頁需要啟用 JavaScript 才能使用。</p></noscript>

<script>
(function () {
  'use strict';

  /* ========== 籤詩資料：30 首原創，上上 6、上吉 10、中平 10、下下 4 ========== */
  var LOTS = [
    { no: 1, level: '上上', title: '雲開見月',
      poem: ['雲開霧散月華明', '久困蛟龍得水行', '但守初心勤著力', '春風一到百花榮'],
      explain: '先前的阻礙正在散去，局勢轉為明朗。維持原本的用心、持續努力，時機一到自然會有好結果。',

  /* ========== 擲筊規則：聖筊 70%、笑筊 15%、陰筊 15% ========== */

  function rollJiao(r) {

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

    jiaoName.textContent = '';
    jiaoDesc.textContent = '請默念所求之事，然後擲筊。';
    throwBtn.hidden = false;
    throwBtn.setAttribute('aria-disabled', 'false');
    toDrawBtn.hidden = true;
    renderThrow();
  }
  function throwJiao() {
    if (state.stage !== 'throw' || state.busy || state.streak >= NEED_STREAK) return;
    state.busy = true;
    throwBtn.setAttribute('aria-disabled', 'true');
    Sound.unlock();
    var outcome = rollJiao();
    var faces;
    if (outcome === 'sheng') faces = Math.random() < 0.5 ? ['flat', 'round'] : ['round', 'flat'];
    else if (outcome === 'xiao') faces = ['flat', 'flat'];
    else faces = ['round', 'round'];
    cups.forEach(function (c, i) { c.cap.textContent = ''; animateCup(c, faces[i]); });
    setTimeout(function () { Sound.knock(); }, Math.round(THROW_MS * 0.76));
    setTimeout(function () { finishThrow(outcome, faces); }, THROW_MS);
  }
  function finishThrow(outcome, faces) {
    if (state.stage !== 'throw') { state.busy = false; return; }
    state.throws++;
    state.history.push(outcome);
    state.streak = outcome === 'sheng' ? state.streak + 1 : 0;
    cups.forEach(function (c, i) { c.cap.textContent = faces[i] === 'flat' ? '平面' : '凸面'; });
    jiaoResult.className = 'jiao-result ' + outcome;
    jiaoName.textContent = JIAO[outcome].name;
    renderThrow();
    state.busy = false;
    if (state.streak >= NEED_STREAK) {
      jiaoDesc.textContent = '三連聖筊，神明允准，請抽籤。';
      Sound.triple();
      var hadFocus = document.activeElement === throwBtn;
      throwBtn.hidden = true;
      toDrawBtn.hidden = false;
      state.lockUntil = Date.now() + 600;   // 避免連按時直接跳過
      if (hadFocus) toDrawBtn.focus();
      return;
    }
    jiaoDesc.textContent = JIAO[outcome].desc;
    if (outcome === 'sheng') Sound.chime();
    throwBtn.setAttribute('aria-disabled', 'false');
  }
  throwBtn.addEventListener('click', throwJiao);
  document.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.code !== 'Space') return;
    if (state.stage !== 'throw' || state.streak >= NEED_STREAK) return;
    var tag = e.target && e.target.tagName;
    // 焦點在按鈕或輸入欄位時，交給瀏覽器原本的行為
    if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'A') return;
    e.preventDefault();
    if (!e.repeat) throwJiao();
  });
  toDrawBtn.addEventListener('click', function () {
    if (state.streak < NEED_STREAK || Date.now() < state.lockUntil) return;
    resetDraw();
    go('draw');
  });
  $('rewishBtn').addEventListener('click', function () {
    if (state.busy) return;
    resetThrow();
    go('wish');
  });

  /* ========== 三、抽籤 ========== */
  var tubeBtn = $('tubeBtn'), shakeBtn = $('shakeBtn'), viewBtn = $('viewBtn'), drawMsg = $('drawMsg');

  function resetDraw() {
    state.lot = null; state.busy = false;
    tubeBtn.classList.remove('shaking', 'drawn');
    tubeBtn.disabled = false;
    shakeBtn.hidden = false;
    shakeBtn.setAttribute('aria-disabled', 'false');
    viewBtn.hidden = true;
    drawMsg.textContent = '點擊籤筒開始抽籤';
  }
  // 30 首等機率，且不與上一次抽中的重複
  function pickLot() {
    var lot;
    do { lot = LOTS[Math.floor(Math.random() * LOTS.length)]; } while (lot.no === state.lastLotNo);
    return lot;
  }
  function drawLot() {
    // 只有連續三個聖筊後才能抽，且每次求籤只能抽一支
    if (state.stage !== 'draw' || state.streak < NEED_STREAK || state.busy || state.lot) return;
    state.busy = true;
    shakeBtn.setAttribute('aria-disabled', 'true');
    drawMsg.textContent = '搖籤中⋯⋯';
    Sound.unlock();
    Sound.startShake(SHAKE_MS);
    tubeBtn.classList.add('shaking');
    setTimeout(function () {
      Sound.stopShake();
      if (state.stage !== 'draw') { state.busy = false; return; }
      var hadFocus = document.activeElement === shakeBtn || document.activeElement === tubeBtn;
      tubeBtn.classList.remove('shaking');
      state.lot = pickLot();
      state.lastLotNo = state.lot.no;
      tubeBtn.classList.add('drawn');
      tubeBtn.disabled = true;
      Sound.tick();
      drawMsg.textContent = '抽中 第' + toCn(state.lot.no) + '籤';
      shakeBtn.hidden = true;
      viewBtn.hidden = false;
      state.lockUntil = Date.now() + 500;
      if (hadFocus) viewBtn.focus();
      state.busy = false;
    }, SHAKE_MS);
  }
  tubeBtn.addEventListener('click', drawLot);
  shakeBtn.addEventListener('click', drawLot);
  viewBtn.addEventListener('click', function () {
    if (!state.lot || Date.now() < state.lockUntil) return;
    showResult();
  });

  /* ========== 四、解籤 ========== */
  var copyBtn = $('copyBtn'), copyTimer = null;

  function lotHead(lot) { return '第' + toCn(lot.no) + '籤'; }
  function showResult() {
    var lot = state.lot;
    $('resNo').textContent = lotHead(lot);
    var lv = $('resLevel');
    lv.textContent = lot.level;
    lv.setAttribute('data-level', lot.level);
    $('resTitle').textContent = '〈' + lot.title + '〉';
    var poem = $('poem');
    poem.textContent = '';
    lot.poem.forEach(function (line) {
      var p = document.createElement('p');
      p.textContent = line;
      poem.appendChild(p);
    });
    $('resExplain').textContent = lot.explain;
    $('resAdviceLabel').textContent = state.category + '建議';
    $('resAdvice').textContent = lot.advice[state.category];
    $('resWish').textContent = state.wish;
    var card = $('resultCard');
    card.classList.remove('rise');
    go('result');
    setTimeout(function () {
      void card.offsetWidth;
      card.classList.add('rise');
      Sound.bell();
    }, reduceMotion ? 0 : 150);
  }
  function lotText() {
    var lot = state.lot;
    return [
      '【雲端宮線上靈籤】' + lotHead(lot) + '・' + lot.level,
      '〈' + lot.title + '〉',
      lot.poem[0] + '，' + lot.poem[1] + '。',
      lot.poem[2] + '，' + lot.poem[3] + '。',
      '',
      '解說：' + lot.explain,
      state.category + '建議：' + lot.advice[state.category],
      '',
      '（原創籤詩，僅供娛樂）'
    ].join('\n');
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyDone(ok) {
    copyBtn.textContent = ok ? '已複製' : '複製失敗';
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copyBtn.textContent = '複製籤詩文字'; }, 2000);
  }
  copyBtn.addEventListener('click', function () {
    if (!state.lot) return;
    var text = lotText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { copyDone(true); }, function () { copyDone(fallbackCopy(text)); });
    } else {
      copyDone(fallbackCopy(text));
    }
  });

  // 以 Canvas 畫出 1080×1350 的籤詩卡（不含生日與願望文字）
  function wrapText(c, text, x, y, maxW, lineH) {
    var noStart = '，。、；：？！」』）';
    var line = '';
    Array.from(text).forEach(function (ch) {
      if (line && c.measureText(line + ch).width > maxW && noStart.indexOf(ch) < 0) {
        c.fillText(line, x, y); y += lineH; line = ch;
      } else {
        line += ch;
      }
    });
    if (line) { c.fillText(line, x, y); y += lineH; }
    return y;
  }
  function renderImage() {
    var lot = state.lot, W = 1080, H = 1350;
    var css = getComputedStyle(document.documentElement);
    var KAI = css.getPropertyValue('--font-kai').trim() || 'serif';
    var SANS = css.getPropertyValue('--font-sans').trim() || 'sans-serif';
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var c = cv.getContext('2d');

    c.fillStyle = '#5C0F0B'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#D4A84B';
    c.lineWidth = 6; c.strokeRect(27, 27, W - 54, H - 54);
    c.lineWidth = 2; c.strokeRect(42, 42, W - 84, H - 84);
    c.fillStyle = '#F7EFDD'; c.fillRect(64, 64, W - 128, H - 128);

    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#B3261E'; c.font = '48px ' + KAI;
    c.fillText('雲端宮線上靈籤', W / 2, 158);
    c.strokeStyle = '#D4A84B'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(W / 2 - 190, 186); c.lineTo(W / 2 + 190, 186); c.stroke();
    c.fillStyle = '#2B1D14'; c.font = 'bold 74px ' + KAI;
    c.fillText(lotHead(lot) + '・' + lot.level, W / 2, 284);
    c.fillStyle = '#B3261E'; c.font = '56px ' + KAI;
    c.fillText('〈' + lot.title + '〉', W / 2, 368);

    // 籤詩直排，由右至左
    var top = 412, rowH = 60, colW = 124;
    c.fillStyle = '#2B1D14'; c.font = '54px ' + KAI; c.textBaseline = 'top';
    lot.poem.forEach(function (line, i) {
      var x = W / 2 + (1.5 - i) * colW;
      Array.from(line).forEach(function (ch, j) { c.fillText(ch, x, top + j * rowH); });
    });

    var y = top + 7 * rowH + 30;
    c.strokeStyle = '#D4A84B'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(130, y); c.lineTo(W - 130, y); c.stroke();
    y += 54;
    c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.font = '34px ' + SANS;
    c.fillStyle = '#2B1D14';
    y = wrapText(c, '解說：' + lot.explain, 130, y, W - 260, 48);
    y += 12;
    c.fillStyle = '#8A1B15';
    wrapText(c, state.category + '建議：' + lot.advice[state.category], 130, y, W - 260, 48);

    c.textAlign = 'center'; c.fillStyle = '#6B5646'; c.font = '26px ' + SANS;
    c.fillText('原創籤詩・僅供娛樂', W / 2, H - 100);
    return cv;
  }
  $('saveBtn').addEventListener('click', function () {
    if (!state.lot) return;
    var cv = renderImage();
    var name = '雲端宮第' + state.lot.no + '籤.png';
    function save(url) {
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    if (cv.toBlob) {
      cv.toBlob(function (blob) {
        if (!blob) { save(cv.toDataURL('image/png')); return; }
        var url = URL.createObjectURL(blob);
        save(url);
        setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      }, 'image/png');
    } else {
      save(cv.toDataURL('image/png'));
    }
  });

  // 再求一支：保留類別與生日，清空願望、進度與擲筊歷程
  $('againBtn').addEventListener('click', function () {
    wishEl.value = '';
    state.wish = '';
    touched.wish = false;
    resetThrow();
    resetDraw();
    refreshForm();
    go('wish');
  });

  /* ========== 靜音 ========== */
  var muteBtn = $('muteBtn');
  function renderMute() {
    var m = Sound.isMuted();
    muteBtn.setAttribute('aria-pressed', m ? 'true' : 'false');
    muteBtn.title = m ? '已靜音，點擊開啟聲音' : '聲音開啟中，點擊靜音';
  }
  muteBtn.addEventListener('click', function () {
    Sound.setMuted(!Sound.isMuted());
    renderMute();
    if (!Sound.isMuted()) { Sound.unlock(); Sound.tick(); }
  });

  /* ========== 初始化 ========== */
  renderMute();
  updateSteps();
  resetThrow();
  resetDraw();
  refreshForm();

  window.yunduan = { simulate: simulate, lots: LOTS, renderImage: renderImage };
})();
</script>
</body>
</html>
